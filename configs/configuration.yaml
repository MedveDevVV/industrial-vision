app:
  name: "Industrial Vision"
  log_level: "INFO"

video:
  source: 0
  reconnect_sec: 2.0
  max_attempts: 5

model:
  path: "models/person/yolo11n.pt"
  confidence: 0.3

inference:
  update_interval_ms: 200
  
roi:
  enabled: true
  points:
    - [0.50, 0.86]
    - [0.73, 0.86]
    - [0.73, 1.00]
    - [0.50, 1.00]

tracking:
  tracker: bytetrack